<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteSMS · Sign In</title>
<style>
:root{
  --bg:#070b14; --card:#0f1720; --card2:#131d2a; --text:#e2e8f0; --muted:#94a3b8; --dim:#64748b;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12); --shadow:0 4px 14px rgba(0,0,0,.35);
  --green:#10b981; --neon:#00ff88; --cyan:#06b6d4; --red:#ef4444; --amber:#fbbf24;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.2;will-change:transform}
.aurora i:nth-child(1){width:520px;height:520px;background:#10b981;left:-140px;top:-120px;animation:f1 22s ease-in-out infinite}
.aurora i:nth-child(2){width:460px;height:460px;background:#0ea5e9;right:-120px;top:20%;animation:f2 28s ease-in-out infinite}
.aurora i:nth-child(3){width:420px;height:420px;background:#6366f1;left:30%;bottom:-180px;animation:f3 26s ease-in-out infinite}
@keyframes f1{50%{transform:translate(120px,90px) scale(1.15)}}
@keyframes f2{50%{transform:translate(-110px,70px) scale(.9)}}
@keyframes f3{50%{transform:translate(90px,-80px) scale(1.2)}}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
.login-wrap{position:relative;z-index:2;width:100%;max-width:410px;padding:20px}
.login-card{background:linear-gradient(180deg,rgba(19,29,42,.82),rgba(15,23,32,.92));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--border2);border-radius:22px;padding:34px 30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;overflow:hidden;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--cyan),#f97316,#0ea5e9,#6366f1,var(--green));background-size:200% 100%;animation:slide 6s linear infinite}
@keyframes slide{to{background-position:200% 0}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}
.logo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:26px}
.logo-mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,rgba(0,255,136,.25),rgba(6,182,212,.08));border:1px solid rgba(0,255,136,.25);box-shadow:0 0 40px rgba(0,255,136,.18);animation:glow 4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 60px rgba(0,255,136,.35)}}
.logo-mark svg{width:34px;height:34px;fill:none;stroke:var(--neon);stroke-width:2.2}
.brand{font-size:28px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(90deg,#10b981,#00ff88,#00bfff);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.brand small{display:block;font-size:13px;font-weight:500;-webkit-text-fill-color:var(--muted);letter-spacing:.2px;margin-top:2px}
.field{margin-bottom:14px;position:relative}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
.input{width:100%;background:rgba(7,11,20,.7);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;outline:none;transition:.25s;color:var(--text);font-family:inherit}
.input:focus{border-color:rgba(0,255,136,.55);box-shadow:0 0 0 3px rgba(0,255,136,.1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--border2);background:var(--card2);cursor:pointer;font-weight:600;transition:.25s;position:relative;overflow:hidden;color:var(--text)}
.btn.primary{background:linear-gradient(135deg,#059669,#10b981);border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.28)}
.btn.primary:hover{box-shadow:0 10px 28px rgba(16,185,129,.45);transform:translateY(-2px)}
.btn.block{width:100%}
.error{color:var(--red);margin-top:14px;font-size:.85rem;text-align:center;padding:12px;border-radius:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);display:none;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.footer{text-align:center;margin-top:24px;color:var(--muted);font-size:.72rem;line-height:1.7}
.footer b{color:var(--neon); /* استفاده از رنگ سبز نئونی */}
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div><div class="grid-bg"></div>
<div class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
      <div class="brand">ByteSMS<small>Smart Panel</small></div>
    </div>
    <div class="field"><label>Username</label><input id="username" class="input" autocomplete="username" autofocus></div>
    <div class="field"><label>Password</label><input id="password" class="input" type="password" autocomplete="current-password"></div>
    <button class="btn primary block" id="btn">Sign In</button>
    <div class="error" id="err"></div>
  </div>
  <div class="footer">ByteSMS<br>Designed &amp; developed by <b>AliXByte</b><br>Sponsored by <b>www.pixelshop24.com</b></div>
</div>
<script>
const $=id=>document.getElementById(id);
fetch('/api/branding').then(r=>r.json()).then(b=>{
  if(b.panel_name){$('.brand').innerHTML=`${b.panel_name}<small>Smart Panel</small>`;document.title=b.panel_name;}
}).catch(()=>{});
function showErr(m){$('err').textContent=m;$('err').style.display='block';}
$('btn').onclick=async()=>{
  const u=$('username').value.trim(),p=$('password').value;
  if(!u||!p){showErr('Enter username and password');return;}
  $('btn').disabled=true;$('btn').textContent='Signing in...';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    const d=await r.json();
    if(r.ok){location.href='/';return;}
    showErr(d.error||'Invalid credentials');
    $('btn').disabled=false;$('btn').textContent='Sign In';
  }catch(e){showErr('Network error');$('btn').disabled=false;$('btn').textContent='Sign In';}
};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('btn').click();});
</script>
</body>
</html>
